# Development and small-venue deployment. Values come from .env (see .env.example). APP_KEY and
# DB_PASSWORD have no defaults on purpose: the stack refuses to start until you choose them. The
# database host is always the db service, and the app is bound to localhost until APP_BIND says
# otherwise (put HTTPS in front of it, see docs/deploy-docker.md).
services:
  app:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8088}:80"
    volumes:
      - .:/var/www/app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8088}
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env (php -r "echo bin2hex(random_bytes(32));")}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-openarcade}
      DB_USER: ${DB_USER:-openarcade}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TEST_DB_NAME: ${DB_NAME:-openarcade}_test
      PAYMENT_MODE: ${PAYMENT_MODE:-none}
      SQUARE_ENV: ${SQUARE_ENV:-sandbox}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Reservations}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-480}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:10.11
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: ${DB_NAME:-openarcade}
      MARIADB_USER: ${DB_USER:-openarcade}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  dbdata: {}
